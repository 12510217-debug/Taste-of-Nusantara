<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rating & Ulasan - Taste of Nusantara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="rating">

  <div id="navbar"></div>

  <main>
    <div class="container py-5">
      <div class="text-center mb-5">
        <h1 class="display-5 fw-bold mb-3">Ulasan & Rating Kuliner</h1>
        <p class="text-muted">Bagikan pengalaman kuliner Anda atau lihat ulasan pecinta kuliner lainnya.</p>
      </div>

      <div class="row justify-content-center mb-5">
        <div class="col-lg-8">
          <div class="card card-nusantara p-4">
            <h4 class="mb-3 fw-bold">Tulis Ulasan Anda</h4>
            <form onsubmit="submitReview(event)">
              <div class="mb-3">
                <label class="form-label fw-semibold">Nama Anda</label>
                <input type="text" id="review-name" class="form-control" required placeholder="Masukkan nama...">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Pilih Hidangan</label>
                <select id="review-food" class="form-select" required>
                  <option value="">-- Pilih Kuliner --</option>
                  <option value="Rendang Minang">Rendang Minang</option>
                  <option value="Gudeg Yogyakarta">Gudeg Yogyakarta</option>
                  <option value="Coto Makassar">Coto Makassar</option>
                  <option value="Soto Banjar">Soto Banjar</option>
                  <option value="Papeda Papua">Papeda Papua</option>
                  <option value="Ayam Betutu Bali">Ayam Betutu Bali</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Rating Bintang</label>
                <select id="review-stars" class="form-select" required>
                  <option value="5">⭐⭐⭐⭐⭐ (5/5 - Sangat Luar Biasa)</option>
                  <option value="4">⭐⭐⭐⭐ (4/5 - Enak & Autentik)</option>
                  <option value="3">⭐⭐⭐ (3/5 - Cukup Baik)</option>
                  <option value="2">⭐⭐ (2/5 - Kurang Sesuai)</option>
                  <option value="1">⭐ (1/5 - Perlu Peningkatan)</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Komentar / Ulasan</label>
                <textarea id="review-comment" class="form-control" rows="3" required placeholder="Bagaimana rasa dan kesan Anda terhadap hidangan ini?"></textarea>
              </div>
              <button type="submit" class="btn btn-custom-primary w-100 py-2">Kirim Ulasan</button>
            </form>
          </div>
        </div>
      </div>

      <h3 class="fw-bold mb-4">Ulasan Terbaru</h3>
      <div class="row g-4" id="reviews-list-grid"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
    function submitReview(e) {
      e.preventDefault();
      const name = document.getElementById('review-name').value;
      const food = document.getElementById('review-food').value;
      const stars = document.getElementById('review-stars').value;
      const comment = document.getElementById('review-comment').value;

      const reviews = getReviews();
      reviews.unshift({ name, food, stars, comment });
      localStorage.setItem('user_reviews', JSON.stringify(reviews));

      showToast('Ulasan Anda berhasil dikirim!');
      e.target.reset();
      renderReviewsList();
    }

    function renderReviewsList() {
      const grid = document.getElementById('reviews-list-grid');
      grid.innerHTML = getReviews().map(r => `
        <div class="col-md-6">
          <div class="card card-nusantara p-4 h-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="fw-bold mb-0">${r.name}</h5>
              <span class="text-warning">${'⭐'.repeat(r.stars)}</span>
            </div>
            <p class="small text-success fw-semibold mb-2">Hidangan: ${r.food}</p>
            <p class="text-muted mb-0">"${r.comment}"</p>
          </div>
        </div>
      `).join('');
    }

    renderReviewsList();
  </script>
</body>
</html>
