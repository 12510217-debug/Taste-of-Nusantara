<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Resep - Taste of Nusantara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="recipe">

  <div id="navbar"></div>

  <main>
    <div class="container py-5" id="recipe-detail-container"></div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
    // Ambil id resep dari alamat halaman, contoh: recipe.html?id=rendang
    const id = new URLSearchParams(window.location.search).get('id');
    const container = document.getElementById('recipe-detail-container');
    const item = getAllCulinaryItems().find(i => i.id === id);

    if (!item) {
      container.innerHTML = `<div class="text-center py-5"><h3>Resep tidak ditemukan.</h3><a href="index.html" class="btn btn-custom-primary mt-3">Kembali ke Home</a></div>`;
    } else {
      document.title = item.name + ' - Taste of Nusantara';
      container.innerHTML = `
        <div class="mb-4">
          <button onclick="history.back()" class="btn btn-sm btn-custom-secondary mb-3"><i class="fa-solid fa-arrow-left me-2"></i> Kembali</button>
          <span class="badge badge-island mb-2 px-3 py-2">${item.island}</span>
          <h1 class="display-4 fw-bold mb-3">${item.name}</h1>
          <p class="lead text-muted">${item.desc}</p>
        </div>

        <div class="row g-4 mb-5">
          <div class="col-lg-7">
            <img src="${item.image}" class="img-fluid rounded-4 w-100 shadow-sm" style="max-height: 450px; object-fit: cover;" alt="${item.name}">
          </div>
          <div class="col-lg-5">
            <div class="card card-nusantara p-4 h-100">
              <h4 class="fw-bold mb-3 text-success"><i class="fa-solid fa-circle-info me-2"></i> Informasi Resep</h4>
              <ul class="list-unstyled mb-0 d-flex flex-column gap-3">
                <li><strong>Waktu Memasak:</strong> ${item.prepTime || '45 Menit'}</li>
                <li><strong>Porsi:</strong> ${item.servings || '4 Porsi'}</li>
                <li><strong>Asal Daerah:</strong> Pulau ${item.island}</li>
                <li><strong>Kategori:</strong> ${item.category === 'heavy' ? 'Makanan Berat' : item.category === 'snacks' ? 'Makanan Ringan' : 'Diet / Sehat'}</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-md-6">
            <div class="card card-nusantara p-4 h-100">
              <h3 class="fw-bold mb-3 text-success"><i class="fa-solid fa-basket-shopping me-2"></i> Bahan-Bahan</h3>
              <ul class="list-group list-group-flush bg-transparent">
                ${Array.isArray(item.ingredients) ? item.ingredients.map(ing => `<li class="list-group-item bg-transparent border-0 px-0 py-2"><i class="fa-solid fa-check text-success me-2"></i> ${ing}</li>`).join('') : `<p>${item.ingredients}</p>`}
              </ul>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card card-nusantara p-4 h-100">
              <h3 class="fw-bold mb-3 text-success"><i class="fa-solid fa-list-ol me-2"></i> Langkah Pembuatan</h3>
              <ul class="list-group list-group-flush bg-transparent">
                ${Array.isArray(item.steps) ? item.steps.map(step => `<li class="list-group-item bg-transparent border-0 px-0 py-2">${step}</li>`).join('') : `<p>${item.steps}</p>`}
              </ul>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
