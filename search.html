<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencarian - Taste of Nusantara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="search">

  <div id="navbar"></div>

  <main>
    <div class="container py-5">
      <div class="text-center mb-5">
        <h1 class="display-5 fw-bold mb-3">Pencarian Kuliner Nusantara</h1>
        <p class="text-muted">Cari makanan berdasarkan nama hidangan, bahan utama, atau daerah asalnya.</p>
        <div class="col-lg-6 mx-auto mt-4">
          <div class="input-group input-group-lg shadow-sm">
            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
            <input type="text" id="live-search-input" class="form-control border-start-0" placeholder="Ketik nama makanan atau bahan." oninput="handleLiveSearch(this.value)">
          </div>
        </div>
      </div>
      <div class="row g-4" id="search-results-grid"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
    // Pencarian langsung saat mengetik
    function handleLiveSearch(query) {
      const grid = document.getElementById('search-results-grid');
      const q = query.toLowerCase().trim();
      if (!q) {
        grid.innerHTML = '';
        return;
      }
      const items = getAllCulinaryItems().filter(i =>
        i.name.toLowerCase().includes(q) ||
        i.island.toLowerCase().includes(q) ||
        i.desc.toLowerCase().includes(q)
      );

      if (items.length === 0) {
        grid.innerHTML = `<div class="text-center py-5 text-muted col-12">Tidak ditemukan kuliner dengan kata kunci "${query}".</div>`;
        return;
      }

      grid.innerHTML = items.map(item =>
        recipeCardHTML(item, 'col-md-4 col-sm-6', 'Lihat Resep', 'btn-custom-primary', false)
      ).join('');
    }
  </script>
</body>
</html>
